<!DOCTYPE html>
<html>

<head>
    <title>Clip O'Clock</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://use.typekit.net/qyd8vvb.css">
</head>

<script>
    function playSound(id) {
        let audio = document.getElementById(id);
        audio.currentTime = 0; // restart if clicked again
        audio.play();
    }
</script>

<body>

    <div class="top-bar">
        <div class="header">
            NIC'S CLIP O'CLOCK
        </div>

        <div class="NavigationBar">

            <a href="index.html">ALL</a>
            <a href="sfx.html">SFX</a>
            <a href="tiktok.html">TIKTOK</a>
            <a href="media.html">MEDIA</a>

        </div>
    </div>

    <div class="grid">

        <div class="item">
            <img src="nicCUTE.JPG" onclick="playSound('sound9')" />
            <p>Awwww… So Cute</p>
        </div>

        <div class="item">
            <img src="crash.jpg" onclick="playSound ('sound13')" />
            <p>Crash</p>
        </div>

        <div class="item">
            <img src="fart.jpg" onclick="playSound('sound11')" />
            <p>FART</p>
        </div>

        <div class="item">
            <img src="Heyyyyyy.PNG" onclick="playSound('sound7')" />
            <p>HEYYYYYYYYY</p>
        </div>

        <div class="item">
            <img src="smile.jpg" onclick="playSound('sound10')" />
            <p>Laugh Track</p>
        </div>

        <div class="item">
            <img src="rupaul.webp" onclick="playSound('sound4')" />
            <p>Shade Button</p>
        </div>


    </div>




    <audio id="sound4" src="ShadeButton.mp3"></audio>
    <audio id="sound7" src="HEYYYY.mp3"></audio>
    <audio id="sound9" src="SoCute.mp3"></audio>
    <audio id="sound10" src="LaughTrack.mp3"></audio>
    <audio id="sound11" src="fart.mp3"></audio>
    <audio id="sound13" src="crash.mp3"></audio>

</body>

</html>
