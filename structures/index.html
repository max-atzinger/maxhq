<!DOCTYPE html>
<!-- <html lang="en"> -->

<head>
    <!-- <meta charset="UTF-8"> -->
    <title>Fridge Art</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div class="fridge-container">
        <!-- Fridge background -->
        <img src="Fridge.webp" class="fridge">

        <!-- Drawing 1 -->
        <div class="drawing-wrapper" style="top:115px; left:300px; transform: rotate(-5deg);">
            <div class="magnet"></div>
            <img src="Drawing1.jpg" class="drawing">
        </div>

        <!-- Drawing 2 -->
        <div class="drawing-wrapper" style="top:500px; left:600px; transform: rotate(5deg);">
            <div class="magnet"></div>
            <img src="Drawing2.webp" class="drawing">
        </div>

        <!-- Drawing 3 -->
        <div class="drawing-wrapper" style="top:1400px; left:100px; transform: rotate(-9deg);">
            <div class="magnet"></div>
            <img src="Drawing3.jpeg" class="drawing">
        </div>

        <!-- Drawing 4 -->
        <div class="drawing-wrapper" style="top:2500px; left:700px; transform: rotate(5deg);">
            <div class="magnet"></div>
            <img src="Drawing4.jpg" class="drawing">
        </div>
    </div>

</body>

</html>
